{% extends "base.html" %}{% block title %}{{ heading }}{% endblock %}
{% block body %}<div class="card"><h1>{{ heading }}</h1><form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label for="title">Title</label><input id="title" name="title" value="{{ p.title or '' }}" maxlength="80" required>
<label for="description">Description</label><textarea id="description" name="description" rows="3" maxlength="400">{{ p.description or '' }}</textarea>
<label for="tech">Technologies (comma separated)</label><input id="tech" name="tech" value="{{ p.tech or '' }}" maxlength="120">
<label for="emoji">Emoji icon</label><input id="emoji" name="emoji" value="{{ p.emoji or '' }}" maxlength="8">
<label for="status">Status</label><select id="status" name="status"><option{% if p.status == 'Live' %} selected{% endif %}>Live</option><option{% if p.status == 'In progress' %} selected{% endif %}>In progress</option></select>
<label for="live_url">Live demo URL</label><input id="live_url" name="live_url" value="{{ p.live_url or '' }}" placeholder="https://">
<label for="source_url">Source code URL</label><input id="source_url" name="source_url" value="{{ p.source_url or '' }}" placeholder="https://github.com/...">
<label for="sort_order">Order (lower shows first)</label><input id="sort_order" name="sort_order" type="number" value="{{ p.sort_order or 0 }}">
<label><input type="checkbox" name="published" style="width:auto"{% if p.published %} checked{% endif %}> Show on the public site</label>
<p><button>Save</button> <a class="btn g" href="{{ url_for('dashboard') }}">Cancel</a></p></form></div>{% endblock %}
